name: Generate snake.svg (light + dark)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  generate-snake:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate snake (light)
        uses: Platane/snk@v3
        with:
          # GANTI dengan username repo owner jika perlu
          github_user_name: ${{ github.repository_owner }}
          # buat file snake-light.svg dengan palette light
          files: |
            snake-light.svg?palette=light&background=transparent

      - name: (Optional) Generate snake (dark)
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          files: |
            snake-dark.svg?palette=dark&background=transparent

      - name: Commit generated svgs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add snake-light.svg snake-dark.svg || true
          if ! git diff --staged --quiet; then
            git commit -m "chore: update generated snake svgs"
            git push
          else
            echo "No changes to commit"
          fi
