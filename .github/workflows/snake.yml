name: Generate Snake Animation

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate snake.svg
        uses: Platane/snk@v3
        with:
          github_user_name: rizkimauln
          outputs: |
            dist/github-snake.svg?palette=github-light&color_snake="%230D6EFD"&color_dots="%23CFE2FF,%239EC5FE,%236EA8FE,%233D8BFD,%230D6EFD"
            dist/github-snake-dark.svg?palette=github-dark&color_snake="%233B82F6"&color_dots="%231E3A8A,%232563EB,%233B82F6,%2360A5FA,%2393C5FD"

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
